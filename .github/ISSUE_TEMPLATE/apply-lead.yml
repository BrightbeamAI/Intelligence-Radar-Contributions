name: "Apply to lead a dimension"
description: "Ask to lead one of the nine dimensions of The Intelligence Radar. The editors decide."
title: "[Apply to lead] "
labels: ["apply-to-contribute", "dimension-lead"]
body:
  - type: markdown
    attributes:
      value: "A dimension lead looks after one of the nine dimensions of The Intelligence Radar: they decide on contributions to it with the specialist reviewers, propose its placements and draft its entries for each edition. Each dimension has one lead. The editors read each application and reply here, and once approved, a lead joins the list of people."
  - type: input
    id: name
    attributes:
      label: "Name"
    validations:
      required: true
  - type: input
    id: affiliation
    attributes:
      label: "Organisation"
      description: "Your organisation, or Independent."
    validations:
      required: false
  - type: dropdown
    id: dimension
    attributes:
      label: "Dimension to lead"
      description: "The dimensions and their entries are on https://theintelligenceradar.com/dimensions.html"
      options:
        - "Models and inference"
        - "Knowledge, context and expertise"
        - "Agents and workflow"
        - "Assurance, security and governance"
        - "Evaluation and learning"
        - "Prediction, science and physical AI"
        - "Work, products and people"
        - "Operations, economics and sovereignty"
        - "Compute and hardware"
    validations:
      required: true
  - type: textarea
    id: experience
    attributes:
      label: "Experience in this dimension"
      description: "What you have built, run, researched or reviewed in it, in a few sentences."
    validations:
      required: true
  - type: textarea
    id: plan
    attributes:
      label: "What you would do as its lead"
      description: "The first changes you would propose, the evidence you would bring and the specialist reviewers you could bring in."
    validations:
      required: true
  - type: textarea
    id: links
    attributes:
      label: "Links"
      description: "Profiles, publications or projects that show your work."
    validations:
      required: false
  - type: textarea
    id: disclosure
    attributes:
      label: "Interests to declare"
      description: "Employers, clients or vendors you work with that this dimension's entries may judge."
      placeholder: "None"
    validations:
      required: true
  - type: checkboxes
    id: terms
    attributes:
      label: "Terms"
      options:
        - label: "I follow the code of conduct in this repository."
          required: true
        - label: "I declare new interests as they arise, and step back from any decision where I have one."
          required: true
        - label: "List my name, organisation and GitHub account on the public list of people if I am approved."
          required: true
