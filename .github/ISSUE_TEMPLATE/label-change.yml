name: "Propose a label change"
description: "Propose a different intelligence or enterprise label for an entry, with the evidence for it."
title: "[Label change] "
labels: ["contribution", "label-change"]
body:
  - type: markdown
    attributes:
      value: "Contributions from the people on the [list of people](https://github.com/BrightbeamAI/Intelligence-Radar-Contributions/blob/main/PEOPLE.md) go to review automatically. Not on it yet? Use **Apply to contribute** first. Editors and specialist reviewers decide here, each decision with its reason. Approved contributions are published on https://theintelligenceradar.com/ with credit."
  - type: input
    id: entry
    attributes:
      label: "Entry"
      description: "The entry's identifier, shown on its page, for example IR-028."
      placeholder: "IR-028"
    validations:
      required: true
  - type: dropdown
    id: proposed_intelligence
    attributes:
      label: "Intelligence label"
      options:
        - "No change"
        - "Use"
        - "Trial"
        - "Evaluate"
        - "Wait"
        - "Prepare"
    validations:
      required: false
  - type: dropdown
    id: proposed_enterprise
    attributes:
      label: "Enterprise label"
      options:
        - "No change"
        - "Revisit"
        - "Test"
        - "Plan for"
        - "Watch"
    validations:
      required: false
  - type: textarea
    id: conditions
    attributes:
      label: "Conditions"
      description: "Where, and under what conditions, the proposed labels hold."
    validations:
      required: true
  - type: textarea
    id: why
    attributes:
      label: "Why"
      description: "The case for the change."
    validations:
      required: true
  - type: textarea
    id: sources
    attributes:
      label: "Sources"
      description: "One per line: URL | title | publisher | date. Everything after the URL is optional."
      placeholder: "https://example.org/report | Report title | Publisher | October 2026"
    validations:
      required: true
  - type: textarea
    id: reverse_if
    attributes:
      label: "What would change this judgement"
      description: "The observation that would make the proposed labels wrong."
    validations:
      required: false
  - type: textarea
    id: disclosure
    attributes:
      label: "Interests to declare"
      description: "Any tie to a vendor, product or organisation named in this entry or in your sources. Write None if there is nothing to declare."
      placeholder: "None"
    validations:
      required: true
  - type: dropdown
    id: credit
    attributes:
      label: "Credit"
      description: "Published contributions credit their contributor by name unless you choose otherwise."
      options:
        - "Credit me by name"
        - "Do not credit me publicly"
    validations:
      required: false
  - type: input
    id: credit_name
    attributes:
      label: "Name to credit"
      description: "Leave empty to use your name on the list of people."
    validations:
      required: false
  - type: textarea
    id: prepared
    attributes:
      label: "Prepared by an AI assistant"
      description: "Filled in when an AI assistant prepared this contribution with The Intelligence Radar's MCP server. Leave it as it is."
      render: json
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: "Terms"
      options:
        - label: "I agree that my contribution is published under CC BY 4.0, with credit as I chose above."
          required: true
        - label: "I follow the code of conduct in this repository."
          required: true
