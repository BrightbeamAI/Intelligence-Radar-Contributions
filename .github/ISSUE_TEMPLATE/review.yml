name: "Review an entry"
description: "Tell the editors whether an entry makes sense, reads well and carries the right labels."
title: "[Review] "
labels: ["contribution", "review"]
body:
  - type: markdown
    attributes:
      value: "Contributions from the people on the [list of people](https://github.com/BrightbeamAI/Intelligence-Radar-Contributions/blob/main/PEOPLE.md) go to review automatically. Not on it yet? Use **Apply to contribute** first. Editors and specialist reviewers decide here, each decision with its reason. Approved contributions are published on https://theintelligenceradar.com/ with credit."
  - type: input
    id: entry
    attributes:
      label: "Entry"
      description: "The entry's identifier, shown on its page, for example IR-028."
      placeholder: "IR-028"
    validations:
      required: true
  - type: dropdown
    id: makes_sense
    attributes:
      label: "Does it make sense?"
      options:
        - "Yes"
        - "Partly"
        - "No"
    validations:
      required: false
  - type: dropdown
    id: easy_to_read
    attributes:
      label: "Is it easy to read?"
      options:
        - "Yes"
        - "Partly"
        - "No"
    validations:
      required: false
  - type: dropdown
    id: intelligence_label
    attributes:
      label: "Is the intelligence label reasonable?"
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: false
  - type: dropdown
    id: proposed_intelligence
    attributes:
      label: "Intelligence label you would give"
      options:
        - "No change"
        - "Use"
        - "Trial"
        - "Evaluate"
        - "Wait"
        - "Prepare"
    validations:
      required: false
  - type: dropdown
    id: enterprise_label
    attributes:
      label: "Is the enterprise label reasonable?"
      options:
        - "Yes"
        - "No"
        - "Not sure"
    validations:
      required: false
  - type: dropdown
    id: proposed_enterprise
    attributes:
      label: "Enterprise label you would give"
      options:
        - "No change"
        - "Revisit"
        - "Test"
        - "Plan for"
        - "Watch"
    validations:
      required: false
  - type: textarea
    id: comments
    attributes:
      label: "Your review"
      description: "What works, what does not, and why."
    validations:
      required: true
  - type: textarea
    id: suggested_wording
    attributes:
      label: "Suggested wording"
      description: "Wording you would like to read instead, if any."
    validations:
      required: false
  - type: textarea
    id: corrections
    attributes:
      label: "Corrections"
      description: "Anything wrong, missing or out of date: a fact, figure, date, product or source, with a link to your evidence."
    validations:
      required: false
  - type: textarea
    id: disclosure
    attributes:
      label: "Interests to declare"
      description: "Any tie to a vendor, product or organisation named in this entry or in your sources. Write None if there is nothing to declare."
      placeholder: "None"
    validations:
      required: true
  - type: dropdown
    id: credit
    attributes:
      label: "Credit"
      description: "Published contributions credit their contributor by name unless you choose otherwise."
      options:
        - "Credit me by name"
        - "Do not credit me publicly"
    validations:
      required: false
  - type: input
    id: credit_name
    attributes:
      label: "Name to credit"
      description: "Leave empty to use your name on the list of people."
    validations:
      required: false
  - type: textarea
    id: prepared
    attributes:
      label: "Prepared by an AI assistant"
      description: "Filled in when an AI assistant prepared this contribution with The Intelligence Radar's MCP server. Leave it as it is."
      render: json
    validations:
      required: false
  - type: checkboxes
    id: terms
    attributes:
      label: "Terms"
      options:
        - label: "I agree that my contribution is published under CC BY 4.0, with credit as I chose above."
          required: true
        - label: "I follow the code of conduct in this repository."
          required: true
