# The review desk: sends each complete contribution, from anyone, to review, takes decisions from comments
# (/approve, /changes, /decline, /edit, /withdraw, /published, /admit, /role, /remove), applies the review
# policy, lists contributors once a contribution of theirs is approved, and keeps labels in step.
# Code: .github/desk/. No secrets needed.
# Comments without a command, comments on pull requests and the desk's own comments start no run.
name: Review desk

on:
  issues:
    types: [opened, edited, reopened]
  issue_comment:
    types: [created]
  push:
    branches: [main]
    paths: [people.json]
  workflow_dispatch:

permissions:
  contents: write   # people.json and PEOPLE.md, when editors admit, change or remove people
  issues: write     # labels, comments, closing

concurrency:
  group: review-desk-${{ github.event.issue.number || 'people' }}
  cancel-in-progress: false

jobs:
  desk:
    if: >-
      ${{ !github.event.issue.pull_request && github.actor != 'github-actions[bot]'
      && (github.event_name != 'issue_comment' || contains(github.event.comment.body, '/')) }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/desk/
          sparse-checkout-cone-mode: false
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false
      - name: Review desk
        run: node .github/desk/run.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
